name: Build and Scan Microservices

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - dev

permissions:
  contents: read

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:

  # ==========================================================
  # 1. Detect which services changed
  # ==========================================================
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.filter.outputs.changes }}

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: none
          filters: |
            api-gateway:
              - 'api-gateway/**'

            user-service:
              - 'user-service/**'

            product-service:
              - 'product-service/**'

            order-service:
              - 'order-service/**'

            payment-service:
              - 'payment-service/**'

            inventory-service:
              - 'inventory-service/**'

            notification-service:
              - 'notification-service/**'

            frontend:
              - 'frontend/**'

  # ==========================================================
  # 2. Build / Scan only changed services
  # ==========================================================
  build-and-scan:

    name: ${{ matrix.service }}
    needs: changes

    if: needs.changes.outputs.services != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Gitleaks
      # --------------------------------------------------
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # --------------------------------------------------
      # 3. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --------------------------------------------------
      # 4. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      # --------------------------------------------------
      # 5. Test
      # --------------------------------------------------
      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: npm test --if-present

      # --------------------------------------------------
      # 6. Lint
      # --------------------------------------------------
      - name: Run lint
        working-directory: ${{ matrix.service }}
        run: npm run lint --if-present

      # --------------------------------------------------
      # 7. Trivy filesystem scan
      # --------------------------------------------------
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ matrix.service }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      # --------------------------------------------------
      # 8. Docker login
      # --------------------------------------------------
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------
      # 9. Generate image tag
      # --------------------------------------------------
      - name: Set image tag
        id: image
        run: |
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${DOCKERHUB_USERNAME}/${{ matrix.service }}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 10. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          load: true
          tags: |
            ${{ steps.image.outputs.image }}

      # --------------------------------------------------
      # 11. Trivy image scan
      # --------------------------------------------------
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      # --------------------------------------------------
      # 12. Push image
      # --------------------------------------------------
      - name: Push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}