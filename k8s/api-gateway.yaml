apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: microservices
  labels: { app: api-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      imagePullSecrets:
        - name: ghcr-creds # only needed if your GHCR images/packages are private -- see README
      containers:
        - name: api-gateway
          image: ${IMAGE_BASE}/api-gateway:${IMAGE_TAG}
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            # Kubernetes Services get a stable DNS name matching their metadata.name
            # within the same namespace, so these resolve without any extra setup.
            - name: USER_SERVICE_URL
              value: "http://user-service:4001"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:4002"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:4003"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:4004"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:4005"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:4006"
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: microservices
spec:
  selector: { app: api-gateway }
  ports:
    - port: 4000
      targetPort: 4000
